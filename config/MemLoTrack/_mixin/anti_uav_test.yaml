
- path: "run.data.val.source"
  value:
    type: "dataset"
    parameters:
      filters:
        - type: "data_cleaning.annotation_standard"
          parameters:
            bounding_box_format: "XYXY"
            bounding_box_coordinate_system: "Continuous"
        - type: "data_cleaning.bounding_box"
          parameters:
            fit_in_image_size: true
            update_validity: true
            remove_invalid_objects: true
            remove_empty_objects: true
        - type: "data_cleaning.integrity"
          parameters:
            remove_zero_annotation_objects: true
            remove_zero_annotation_image: true
            remove_zero_annotation_video_head_tail: true
            remove_invalid_image: true
      datasets:
        - name: "Anti_UAV_300_VIS"
          type: "SOT"
          splits: "val"
        - name: "Anti_UAV_410"
          type: "SOT"
          splits: "val"

          
# ── EVAL Phase ──
- path: "run.data.eval.source"
  value:
    type: "dataset"
    parameters:
      # SA requires the original frame sequence, including target-absent
      # frames. Do not add filters that remove invalid/empty annotations.
      filters:
        - type: "data_cleaning.annotation_standard"
          parameters:
            bounding_box_format: "XYXY"
            bounding_box_coordinate_system: "Continuous"
      datasets:
        - name: "Anti_UAV_410"
          type: "SOT"
          splits: "test"
          parameters:
            evaluation_mode: "state_accuracy"
